name: PR Coverage Analyzer

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  coverage-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Java project
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and test with Maven (JaCoCo)
        run: mvn clean test

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ github.workspace }}/target/site/jacoco/jacoco.xml

      - name: Checkout PR Coverage Analyzer
        uses: actions/checkout@v4
        with:
          repository: LucasKonrath/sentry
          path: pr-coverage-analyzer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd pr-coverage-analyzer
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Convert JaCoCo to Cobertura format
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          import sys
          
          # Read JaCoCo XML
          tree = ET.parse('${{ github.workspace }}/target/site/jacoco/jacoco.xml')
          root = tree.getroot()
          
          # Create Cobertura XML structure
          coverage = ET.Element('coverage')
          coverage.set('line-rate', '0.0')
          coverage.set('branch-rate', '0.0')
          coverage.set('version', '1.0')
          coverage.set('timestamp', '0')
          
          packages = ET.SubElement(coverage, 'packages')
          
          for package in root.findall('.//package'):
              pkg = ET.SubElement(packages, 'package')
              pkg.set('name', package.get('name', ''))
              pkg.set('line-rate', '0.0')
              pkg.set('branch-rate', '0.0')
              
              classes = ET.SubElement(pkg, 'classes')
              
              for cls in package.findall('.//class'):
                  cl = ET.SubElement(classes, 'class')
                  cl.set('name', cls.get('name', ''))
                  cl.set('filename', cls.get('sourcefilename', ''))
                  cl.set('line-rate', '0.0')
                  cl.set('branch-rate', '0.0')
                  
                  methods = ET.SubElement(cl, 'methods')
                  lines = ET.SubElement(cl, 'lines')
          
          # Write Cobertura XML
          cobertura_tree = ET.ElementTree(coverage)
          cobertura_tree.write('${{ github.workspace }}/target/site/jacoco/cobertura.xml', encoding='utf-8', xml_declaration=True)
          "

      - name: Configure environment variables
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> pr-coverage-analyzer/.env
          echo "LLM_PROVIDER=claude" >> pr-coverage-analyzer/.env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> pr-coverage-analyzer/.env
          echo "LLM_MODEL=claude-3-5-sonnet-20241022" >> pr-coverage-analyzer/.env
          echo "COVERAGE_THRESHOLD=80" >> pr-coverage-analyzer/.env
          echo "MIN_COVERAGE_INCREASE=5" >> pr-coverage-analyzer/.env
          echo "LOG_LEVEL=INFO" >> pr-coverage-analyzer/.env
          echo "LOCAL_MODE=false" >> pr-coverage-analyzer/.env

      - name: Run PR Coverage Analyzer
        run: |
          cd pr-coverage-analyzer
          source .venv/bin/activate
          python -m src.main --repo-url "${{ github.repository }}" --pr-number 1 --coverage-report ${{ github.workspace }}/target/site/jacoco/cobertura.xml